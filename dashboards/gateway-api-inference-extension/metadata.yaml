sample_dashboards:
  -
    category: GKE Inference Gateway
    id: inference-extension-prometheus
    display_name: GKE Inference Gateway Prometheus Overview (< v1.1.0)
    description: "This dashboard has charts displaying throughput, latency, cache usage, and other metrics for GKE Inference Gateway. Use this dashboard if you use inference gateway before version v1.1.0."
    related_integrations:
      - id: gateway-api-inference-extension
        platform: GKE
        version: "1"
  -
    category: GKE Inference Gateway
    id: inference-extension-prometheus-2
    display_name: GKE Inference Gateway Prometheus Overview
    description: "This dashboard has charts displaying throughput, latency, cache usage, and other metrics for GKE Inference Gateway (gateway-api-inference-extension <= v1.5.0 / llm-d < v0.8.0). For llm-d >= v0.8.0 (both Standalone and Gateway modes), use the unified llm-d Overview dashboard instead."
    related_integrations:
      - id: gateway-api-inference-extension
        platform: GKE
        version: "2"
