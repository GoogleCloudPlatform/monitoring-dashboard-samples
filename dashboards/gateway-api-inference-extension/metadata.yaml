sample_dashboards:
  -
    category: GKE Inference Gateway
    id: inference-extension-prometheus
    display_name: GKE Inference Gateway Prometheus Overview (< v1.1.0)
    description: "This dashboard has charts displaying throughput, latency, cache usage, and other metrics for GKE Inference Gateway. Use this dashboard if you use inference gateway before version v1.1.0."
    related_integrations:
      - id: gateway-api-inference-extension
        platform: GKE
        version: "1"
  -
    category: GKE Inference Gateway
    id: inference-extension-prometheus-2
    display_name: GKE Inference Gateway Prometheus Overview (v1.1.0 - v1.5.0)
    description: "This dashboard has charts displaying throughput, latency, cache usage, and other metrics for GKE Inference Gateway. Use this dashboard if you use inference gateway versions v1.1.0 through v1.5.0 (or llm-d before v0.8.0)."
    related_integrations:
      - id: gateway-api-inference-extension
        platform: GKE
        version: "2"
  -
    category: GKE Inference Gateway
    id: inference-extension-prometheus-3
    display_name: GKE Inference Gateway Prometheus Overview
    description: "This dashboard has charts displaying Application Load Balancer, llm-d EPP, vLLM, and GPU networking metrics for GKE Inference Gateway and llm-d stacks. This dashboard requires integration v3 metrics."
    related_integrations:
      - id: gateway-api-inference-extension
        platform: GKE
        version: "3"
