sample_dashboards:
  -
    category: Gemini Enterprise
    id: gemini-enterprise-overview
    display_name: Gemini Enterprise Overview
    description: |-
      Request volume, latency (p50 / p95 / p99, time to first token, time to first answer), agent sessions, data connector health and Discovery Engine API calls of your Gemini Enterprise apps, built from the native [Gemini Enterprise metrics](https://docs.cloud.google.com/gemini/enterprise/docs/access-metrics). Agent and data connector metrics require OpenTelemetry instrumentation to be enabled in the app's [observability settings](https://docs.cloud.google.com/gemini/enterprise/docs/manage-observability-settings).
  -
    category: Gemini Enterprise
    id: gemini-enterprise-usage-from-user-activity-logs
    display_name: Gemini Enterprise Usage from User Activity Logs
    description: |-
      Assistant turns, searches, active users, sessions, usage by app, agent, model and data source, UI page views, top users, recent conversations, popular prompts and agent lifecycle events, built with Log Analytics SQL from the [Gemini Enterprise user activity log](https://docs.cloud.google.com/gemini/enterprise/docs/set-up-usage-audit-logs). Requires observability to be enabled per app and [Log Analytics](https://cloud.google.com/logging/docs/buckets#upgrade-bucket) on the _Default log bucket.
  -
    category: Gemini Enterprise
    id: gemini-enterprise-quality-safety-and-token-usage-from-logs
    display_name: Gemini Enterprise Quality, Safety and Token Usage from Logs
    description: |-
      Answer outcomes, failed or skipped turns, user feedback and comments, grounding sources and most cited documents, Model Armor sanitization results, token consumption per app and agent, agent tool calls and Discovery Engine API errors, built with Log Analytics SQL from the [Gemini Enterprise logs](https://docs.cloud.google.com/gemini/enterprise/docs/set-up-usage-audit-logs). Requires observability to be enabled per app and [Log Analytics](https://cloud.google.com/logging/docs/buckets#upgrade-bucket) on the _Default log bucket.
