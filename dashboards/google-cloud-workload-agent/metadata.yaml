sample_dashboards:
  -
    category: Agent for Compute Workloads
    id: agent-for-compute-workloads-oracle-status-overview
    display_name: Agent for Compute Workloads - Oracle Status Overview
    description: |-
      This dashboard monitors Oracle Database instances running on Compute Engine VMs using metrics collected by [Google Cloud Agent for Compute Workloads](https://cloud.google.com/workload-manager/docs/evaluate/set-up-agent-for-oracle). It provides charts for Average Active Sessions by Wait Class, Database memory usage (PGA and SGA components), Database time breakdown, Oracle agent health, as well as Compute Engine VM CPU utilization, Network Traffic, and Disk I/O.
    related_integrations:
      - id: workload_agent_for_oracle
        platform: GCP
