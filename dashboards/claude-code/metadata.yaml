sample_dashboards:
  -
    category: Claude Code
    id: claude-code-monitoring
    display_name: Claude Code Monitoring
    description: |-
      Adoption, coding activity and token usage for [Claude Code](https://code.claude.com/docs/en/monitoring-usage) sessions that export OpenTelemetry metrics to the Telemetry (OTLP) API: sessions, active users, commits and pull requests made through Claude Code, active coding hours, lines of code added and removed, edit-tool accept rate, tokens by model and type, and estimated spend by user, model and query source.

      Metrics are queried by their OpenTelemetry names (claude_code.session.count, claude_code.token.usage, ...) as the Telemetry API stores them.
